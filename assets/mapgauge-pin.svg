<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>MapGauge icon: gauge inside a map pin</title>
  <!-- Rounded-square pin (deliberately not Google's teardrop) -->
  <path fill="#0F766E" d="M44 8h40c15.5 0 28 12.5 28 28v32c0 15.5-12.5 28-28 28h-8l-12 24-12-24h-8c-15.5 0-28-12.5-28-28V36C16 20.5 28.5 8 44 8z"/>
  <!-- Gauge track -->
  <path d="M34 70a30 30 0 0 1 60 0" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
  <!-- Gauge progress (high score) -->
  <path d="M34 70a30 30 0 0 1 52.98-19.28" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <!-- Needle + hub -->
  <path d="M64 70 80.5 56" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="64" cy="70" r="7" fill="#fff"/>
</svg>
